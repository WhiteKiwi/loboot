[package]
name = "loboot"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Explicit, native user-service management without a daemon"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WhiteKiwi/loboot"
readme = "README.md"
keywords = ["launchd", "systemd", "service", "automation"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
fs2 = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
