name: Release
# Match locron: an authorized version-tag push starts publication automatically.
# Main-branch merges do not release, and this workflow never creates a tag.
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    name: Tag push, license, changelog, and version gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate the pushed release tag
        run: |
          test "$GITHUB_EVENT_NAME" = push || { echo 'Release requires a tag push.' >&2; exit 1; }
          test "$GITHUB_REF_TYPE" = tag || { echo 'Release requires a vX.Y.Z tag, not a branch.' >&2; exit 1; }
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/release.py gate --tag "$GITHUB_REF_NAME"
  readiness:
    needs: gate
    uses: ./.github/workflows/release-readiness.yml
    with:
      tag: ${{ github.ref_name }}
  publish:
    name: Publish only the verified existing tag
    needs: [gate, readiness]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: loboot-dist-*
          path: artifacts
      - name: Revalidate exact archives and release prerequisites
        run: |
          python3 scripts/release.py gate --tag "$GITHUB_REF_NAME"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          python3 scripts/release.py collect --artifacts artifacts --out release-artifacts --version "$version"
          python3 scripts/release.py notes --tag "$GITHUB_REF_NAME" --output release-notes.md
      - name: Publish verified assets without creating a tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)"
          test "$current_tag_sha" = "$GITHUB_SHA" || { echo 'Tag moved after verification; refusing publication.' >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "loboot $GITHUB_REF_NAME" --notes-file release-notes.md \
            release-artifacts/*.tar.gz release-artifacts/SHA256SUMS.txt release-artifacts/manifest.json
      - name: Verify downloaded release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir verified-download \
            --pattern '*.tar.gz' --pattern SHA256SUMS.txt --pattern manifest.json
          diff -u release-artifacts/manifest.json verified-download/manifest.json
          diff -u release-artifacts/SHA256SUMS.txt verified-download/SHA256SUMS.txt
          cd verified-download
          sha256sum --check SHA256SUMS.txt
