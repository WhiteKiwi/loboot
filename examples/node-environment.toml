# Unreleased environment support: published v0.1.0 rejects this table.
# Replace all /opt paths with actual absolute, non-symlinked paths for your account.
# Use the real Node executable, not a shell alias or version-manager shim.
id = "node-worker"
executable = "/opt/node/bin/node"
args = ["/opt/node-worker/server.js"]
cwd = "/opt/node-worker"
mode = "service"
restart = "on-failure"

# Non-secret configuration only. Original values are stored in plaintext and
# can be visible to the native manager, descendants, native tools, and logs.
[environment]
APP_LOG_LEVEL = "info"
NODE_ENV = "production"
# Complete override for child-program lookup, not an append to the shell PATH.
# Directories are checked for syntax only; verify their existence and trust.
PATH = "/opt/node/bin:/usr/bin:/bin"
